spring.application.name=ProbeAPI
server.port=8080
server.servlet.context-path=/api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# H2 Database Configuration (for development/testing)
spring.datasource.url=jdbc:h2:mem:probeapi_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# HTTP Configuration
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.anudeep.probeapi=INFO
logging.level.org.springframework.security=INFO

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Security & JWT
jwt.secret=super-secure-random-64-char-secret-key
jwt.expiration=${JWT_EXPIRATION:86400000}

# Application Configuration
app.name=ProbeAPI
app.version=1.0.0
